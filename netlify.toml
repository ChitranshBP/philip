[build]
  command = "php build.php"
  publish = "dist"

# Long cache for fingerprint-free assets is risky, so keep it modest and let
# Netlify revalidate. Images and CSS change rarely but do change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
